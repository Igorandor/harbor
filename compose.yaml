name: iris-harbor
services:
  iris:
    build:
      context: .
      dockerfile: iris/Dockerfile
    command: ['--check-caps', 'false']
    ports:
      - '127.0.0.1:${IRIS_WEB_PORT:-52773}:52773'
    volumes:
      - iris-data:/usr/irissys/mgr
    healthcheck:
      test: ['CMD', 'iris', 'qlist', 'IRIS']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  portal:
    build: .
    environment:
      IRIS_URL: http://iris:52773
      HOST: 0.0.0.0
      PORT: 3100
      PUBLIC_ORIGIN: ${HARBOR_ORIGIN:-http://localhost:3100}
      COOKIE_SECURE: 'false'
      IRIS_INSTANCE_ID: ${IRIS_INSTANCE_ID:-harbor-evaluation}
      HARBOR_DATA_DIR: /app/data
      HARBOR_MODE: evaluation
    volumes:
      - harbor-data:/app/data
    ports:
      - '127.0.0.1:${HARBOR_PORT:-3100}:3100'
    depends_on:
      iris:
        condition: service_healthy
volumes:
  iris-data:
  harbor-data:
