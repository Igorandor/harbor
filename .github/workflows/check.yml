name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/build-ipm.mjs
      - run: npm run test:ipm
      - run: git diff --exit-code -- ipm/harbor-gateway
      - run: python3 scripts/check-log-reader.py
      - run: npm audit --omit=dev
      - run: docker build -t iris-harbor-portal .
